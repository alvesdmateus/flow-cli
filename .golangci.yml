version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Security
    - gosec
    # Style
    - gofmt
    - goimports
    # Bugs
    - bodyclose
    - noctx
    # Code quality
    - unconvert

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow # Too noisy for this codebase style

  gosec:
    excludes:
      - G104 # Audit errors not checked (too noisy for CLI)
      - G204 # Subprocess with variable - intentional for CLI tool
      - G301 # Directory permissions - CLI uses 0755 for config dirs
      - G302 # File permissions - CLI writes code files
      - G304 # File inclusion via variable - CLI reads user-specified files
      - G306 # WriteFile permissions - CLI writes code files with 0644

  goimports:
    local-prefixes: github.com/mateus/vibe-cli

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - noctx

    # Exclude main.go from some checks
    - path: main\.go
      linters:
        - errcheck

    # Exclude cmd files from some checks (CLI entry points)
    - path: cmd/
      linters:
        - noctx

    # Exclude tools that intentionally handle errors by returning nil
    - path: internal/tools/
      text: "error is not nil.*but it returns nil"

    # Exclude context manager session handling
    - path: internal/context/
      text: "error is not nil.*but it returns nil"

  max-issues-per-linter: 50
  max-same-issues: 5
